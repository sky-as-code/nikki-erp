services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: nikki_postgres
    environment:
      POSTGRES_DB: postgres # Prevent creating new database. We create one ourselves in init.sql
      POSTGRES_USER: nikki_admin
      POSTGRES_PASSWORD: nikki_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikki_admin -d nikki_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nikki_net

  pgadmin:
    image: dpage/pgadmin4:9.2.0
    container_name: nikki_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nikki-erp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nikki_net

  keydb:
    image: eqalpha/keydb:x86_64_v6.3.4
    container_name: nikki_keydb
    environment:
      KEYDB_PASSWORD: nikki_password
    command: keydb-server --appendonly yes
    volumes:
      - keydb_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli -a nikki_password ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nikki_net

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: nikki_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nikki_admin
      RABBITMQ_DEFAULT_PASS: nikki_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
      - "1883:1883" # MQTT port
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nikki_net

  vernemq:
    image: vernemq/vernemq:2.1.1-alpine
    container_name: nikki_vernemq
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "off"
      VERNE_USER: "nikki_username"
      VERNE_PASSWORD_FILE: "/vernemq/passwd"

      DOCKER_VERNEMQ_LISTENER__TCP__DEFAULT: "0.0.0.0:1883"
      DOCKER_VERNEMQ_LISTENER__SSL__DEFAULT: "0.0.0.0:8883"

      DOCKER_VERNEMQ_LISTENER__SSL__CAFILE: "/vernemq/certs/nikki-verne-client-ca.crt"
      DOCKER_VERNEMQ_LISTENER__SSL__CERTFILE: "/vernemq/certs/verne.nikkierp.com.crt"
      DOCKER_VERNEMQ_LISTENER__SSL__KEYFILE: "/vernemq/certs/verne.nikkierp.com.key"

      DOCKER_VERNEMQ_LISTENER__SSL__DEFAULT__ALLOW_ANONYMOUS_OVERRIDE: "on"
      DOCKER_VERNEMQ_LISTENER__SSL__REQUIRE_CERTIFICATE: "on"
      DOCKER_VERNEMQ_LISTENER__SSL__USE_IDENTITY_AS_USERNAME: "on"
      DOCKER_VERNEMQ_PLUGINS__VMQ_PASSWD: "on"
    ports:
      - "1884:1883"
      - "8883:8883"
      - "8081:8080"
    volumes:
      - vernemq-data:/vernemq/data
      - vernemq-log:/vernemq/log
      - ./vernemq/certs:/vernemq/certs:ro
      - ./vernemq/init.sh:/init.verne.sh
      - ./vernemq/passwd:/vernemq/passwd
    entrypoint: ["/bin/sh", "/init.verne.sh"]
    networks:
      - nikki_net

networks:
  nikki_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  keydb_data:
  redis_data:
  rabbitmq_data:
  vernemq-data:
  vernemq-log:
