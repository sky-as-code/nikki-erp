GENERAL:
  APP_NAME: "Nikki ERP"

CORE:
  # Seconds given to modules to drain background work after a termination signal, before
  # the HTTP server closes and the process exits. A module that overruns is abandoned.
  SHUTDOWN_GRACE_SECS: 30
  CQRS:
    # Number of seconds before a CQRS request is timed out
    REQUEST_TIMEOUT_SECS: 50
  DB:
    # Supported dialects: postgres | mysql
    DIALECT: postgres
    # Host:Port pair of the database server
    HOST_PORT: localhost:5432
    # Database name
    DATABASE: nikki_erp
    # Database username can be specified in env var CORE_DB_USER or
    # in config item CORE.DB.USER_FILE which contains a secret file path.
    #USER: "Do not specify here"
    # Database password can be specified in env var CORE_DB_PASSWORD or
    # in config item CORE.DB.PASSWORD_FILE which contains a secret file path.
    #PASSWORD: "Do not specify here"
    # Whether to establish TLS connection to database
    TLS_ENABLED: true
    # Whether to write ORM debug SQL queries
    ORM_DEBUG_ENABLED: false
    MAX_IDLE_CONNS: 100
    MAX_OPEN_CONNS: 1000
    CONN_MAX_LIFETIME_SECS: 3600
  DISTRIBUTED_LOCK:
    REDIS_HOST: localhost
    # A comma-separated list of Redis hosts for cluster mode
    # REDIS_HOSTS:
    # Redis port, applied for all hosts in REDIS_HOSTS
    REDIS_PORT: 6379
    # Regis database. See: https://redis.io/docs/latest/commands/select/
    REDIS_DB: 1
    # Redis password can be specified in env var CORE_EVENT_REDIS_PASSWORD or
    # in config item CORE.EVENT.REDIS_PASSWORD_FILE which contains a secret file path.
    REDIS_PASSWORD: "nikki_password"
  ENCRYPTION:
    # Hex-encoded 32-byte AES key that sensitive field values are encrypted with before they are
    # written to the database — today, the gateway credentials of a paymentinvoice payment profile.
    # Left empty here because this file is committed and embedded into the binary: supply it
    # through config/local.env, or through CORE_ENCRYPTION_EAS_32_BYTES_KEY_FILE in a deployed
    # environment. A deployment that leaves it empty can neither store nor read a payment profile's
    # credentials, and is warned about it at boot.
    EAS_32_BYTES_KEY: ""
  EVENT:
    REDIS_HOST: localhost
    # A comma-separated list of Redis hosts for cluster mode
    # REDIS_HOSTS:
    # Redis port, applied for all hosts in REDIS_HOSTS
    REDIS_PORT: 6379
    # Regis database. See: https://redis.io/docs/latest/commands/select/
    REDIS_DB: 1
    # Redis password can be specified in env var CORE_EVENT_REDIS_PASSWORD or
    # in config item CORE.EVENT.REDIS_PASSWORD_FILE which contains a secret file path.
    #REDIS_PASSWORD: "Do not specify here"
  HTTP:
    # Base path to access REST API, default is "/" which means API URL is http://example.com/,
    # Example: BASE_PATH="/api", the API URL would be http://example.com/api.
    BASE_PATH: ""
    # Host name for HTTP Server to bind
    HOST: "127.0.0.1"
    # Port number for HTTP Server to listen
    PORT: 8080
    # Port number for HTTPS Server to listen
    HTTPS_PORT: 4433
    HTTPS_ENABLED: true
    HTTPS_RSA_PUBLIC_KEY_FILE: "./scripts/cert/pki/server-cert/api.nikkierp.com.crt"
    HTTPS_RSA_PRIVATE_KEY_FILE: "./scripts/cert/pki/server-cert/api.nikkierp.com.key"
    CORS_ENABLED: true
    # Allowed origins for Cross-Origin Resource Sharing
    CORS_ORIGINS: "*"
    # Allowed headers for Cross-Origin Resource Sharing
    CORS_HEADERS: "Accept,Authorization,Content-Type,Origin"
    # Allowed methods for Cross-Origin Resource Sharing
    CORS_METHODS: "OPTIONS,HEAD,GET,POST,PATCH,DELETE"
    MTLS_ENABLED: true
    MTLS_CLIENT_CA_CERT_FILE: "scripts/cert/pki/client-ca/nikkierp-client-ca.crt"
    MTLS_CLIENT_CERT_FILE: "scripts/cert/pki/client-cert/nikkierp-client-cert.crt"
    MTLS_CLIENT_KEY_FILE: "scripts/cert/pki/client-cert/nikkierp-client-cert.key"
  HTTP_CLIENT:
    # Milisecond
    REQUEST_TIMEOUT: 30000

    # Skip verify third server cert
    INSECURE_SKIP_VERIFY: false
    INCLUDE_SYSTEM_TRUSTED_CA: true
    TRUSTED_CA_CERT_FILE: ""

    CLIENT_CERT_ENABLED: false
    # Client cert file config is either Key-pair or P12
    # Key-pair
    CLIENT_CERT_FILE: ""
    CLIENT_KEY_FILE: ""

    # P12 and password
    CLIENT_P12_FILE: ""
    CLIENT_P12_PASSWORD: ""
  PUB_SUB:
    REDIS_HOST: localhost
    # A comma-separated list of Redis hosts for cluster mode
    # REDIS_HOSTS:
    # Redis port, applied for all hosts in REDIS_HOSTS
    REDIS_PORT: 6379
    # Regis database. See: https://redis.io/docs/latest/commands/select/
    REDIS_DB: 1
    # Redis password can be specified in env var CORE_EVENT_REDIS_PASSWORD or
    # in config item CORE.EVENT.REDIS_PASSWORD_FILE which contains a secret file path.
    REDIS_PASSWORD: "nikki_password"

    VERNE_HOST: localhost
    VERNE_PORT: 1884
    VERNE_SCHEME: tcp
    VERNE_USERNAME: "nikki_username"
    VERNE_PASSWORD: "nikki_passwd"
  S3_STORAGE:
    REGION_NAME: "hcm"
    ACCESS_TOKEN: "access-token"
    SECRET_KEY: "secret-key"
    ENDPOINT: "https://hcm.ss.bfcplatform.vn"
    BUCKET: ""
  TOKEN:
    # Secret key for JWT token signing and verification
    # IMPORTANT: Override this in local.env or production environment
    # DO NOT commit real secret keys to version control
    SECRET_KEY: "your-secret-key-here-change-in-production"
    # Token expiry time in hours
    EXPIRY_HOURS: 24
  REQUEST_GUARD:
    ACCESS_TOKEN_ENABLED: true
    ACCESS_TOKEN_DPOP_ENABLED: false
    # Supported algorithms: HS256 | RS256
    # If using HS256, ACCESS_TOKEN_SHA256_SECRET must be specified.
    # If using RS256, ACCESS_TOKEN_RSA_PUBLIC_KEY and ACCESS_TOKEN_RSA_PRIVATE_KEY must be specified.
    ACCESS_TOKEN_ALGORITHM: "EdDSA"
    # Comma separated list of target API Gateways: extapi | intapi
    ACCESS_TOKEN_AUDIENCE: "extapi"
    ACCESS_TOKEN_EXPIRY_MINUTES: 3
    ACCESS_TOKEN_ISSUER: "nikki-erp"
    ACCESS_TOKEN_HTTP_HEADER_NAME: "Authorization"
    # Leading and trailing whitespace will be trimmed from this prefix
    # before prepending it to the access token value.
    # The result header: "{Prefix} {AccessToken}"
    ACCESS_TOKEN_HTTP_HEADER_PREFIX: "Bearer"
    ACCESS_TOKEN_SECRET: "your-secret-key-here-change-in-production"
    ACCESS_TOKEN_PUBLIC_KEY_FILE: "scripts/cert/pki/jwt-keypair/ed25519.pub"
    ACCESS_TOKEN_PRIVATE_KEY_FILE: "scripts/cert/pki/jwt-keypair/ed25519.key"
    # Refresh token expiry time in minutes.
    REFRESH_TOKEN_EXPIRY_MINUTES: 30
    SESSION_BLACKLIST_ENABLED: false

IAM:
  # Number of seconds before a login attempt expires
  LOGIN_ATTEMPT_DURATION_SECS: 300

PAYMENTINVOICE:
  # Each gateway is off unless its ENABLED flag is set, and a gateway that is off is not
  # registered at all: asking to pay through it is refused as a client error rather than
  # attempted against credentials that were never supplied.
  #
  # The SECRET_KEY values and the passwords below are credentials and are deliberately left
  # empty here. This file is committed and embedded into the binary. Supply them per
  # environment through config/local.env for local work, or through the {KEY}_FILE
  # secret-file convention in a deployed environment.
  MOMO:
    ENABLED: false
    PARTNER_CODE: ""
    ACCESS_KEY: ""
    SECRET_KEY: ""
    API_ENDPOINT: "https://test-payment.momo.vn/v2/gateway/api"
    # Where MoMo posts the payment result. Sent to MoMo on every create, so changing it
    # needs nothing done on MoMo's side.
    IPN_URL: ""
    # Where the payer's browser is sent afterwards. A human destination: nothing is
    # settled by a visit to it.
    REDIRECT_URL: ""
    # Names the merchant's store, for accounts whose settlement MoMo breaks down by one.
    # Optional: an account with no such breakdown leaves it empty and it is not sent.
    STORE_ID: ""

  MPOS:
    ENABLED: false
    MERCHANT_ID: ""
    SECRET_KEY: ""
    API_ENDPOINT: ""

  VIETQR:
    ENABLED: false
    API_ENDPOINT: ""
    # The credentials this module presents when it calls VietQR.
    USERNAME: ""
    PASSWORD: ""
    SECRET_KEY: ""
    # The credentials the bank presents when it calls this module. VietQR's integration has
    # the partner host the token endpoint, so these are a separate pair from the two above.
    INBOUND_USERNAME: ""
    INBOUND_PASSWORD: ""
    INBOUND_JWT_SECRET: ""
    BANK_NUMBER: ""
    BANK_NAME: ""
    BANK_CODE: ""

  ORDER:
    # How long an order may sit unpaid before the watchdog asks the gateway for a verdict
    # and, failing one, expires it.
    EXPIRE_AFTER_MINS: 15
    # How long an unpaid or expired order is kept before deletion.
    CLEAN_AFTER_HOURS: 24

  SYNC:
    # Bounds one attempt to notify the ordering system of a payment result.
    TIMEOUT_SECS: 5
    MAX_RETRIES: 3

JOBSCHEDULER:
  # Attempt budget for a job that does not override max_attempts. Counts the first attempt,
  # so 3 means attempts 1, 2 and 3.
  DEFAULT_MAX_ATTEMPTS: 3
  # Base retry delay, doubled by exponential backoff. A job may override it but never below
  # 5 seconds: a smaller value is rejected rather than rounded up.
  DEFAULT_RETRY_INTERVAL_SECS: 10
  # Ceiling on a single backoff delay. Not a job field and not overridable through the API:
  # lowering it to shed load must take effect on work already queued.
  EXPBACKOFF_MAX_INTERVAL_SECS: 300
  # Bounds one attempt end to end: the REST call, the command, the worker context, and the
  # upper bound of the lease.
  DEFAULT_ATTEMPT_TIMEOUT_SECS: 60
  # Added to the attempt timeout to form the lease, so a worker that is merely slow is not
  # reaped while it is still running.
  LEASE_SAFETY_MARGIN_SECS: 30
  # Fallback sweep that recovers from lost wake-ups and dead instances. This is a safety net,
  # NOT the resolution of the cron schedule: raising it does not make jobs less punctual.
  RECONCILIATION_INTERVAL_SECS: 60
  # Bounded worker pool on each application instance.
  WORKER_CONCURRENCY: 8
  # Executions taken in one claim. Keep it in proportion to WORKER_CONCURRENCY: claiming more
  # than the pool can start holds leases on work that is not running.
  CLAIM_BATCH_SIZE: 20
  # Applied when a job declares no concurrency policy.
  DEFAULT_CONCURRENCY_POLICY: "forbid_overlap"
  # Applied when a job declares no misfire policy.
  DEFAULT_MISFIRE_POLICY: "run_once"
  # Applied when a job is created without an explicit is_enabled.
  DEFAULT_JOB_ENABLED: true
  # How long finished executions and their attempts are kept.
  HISTORY_RETENTION_DAYS: 30
  # How late an occurrence may be noticed and still run normally. Beyond this it counts as
  # missed and the misfire policy decides.
  MISFIRE_THRESHOLD_SECS: 120
